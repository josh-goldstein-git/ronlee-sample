  body {

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }

  header.site { border-bottom: 3px solid var(--accent); background: var(--paper); }

  h2 { font-size: 1.5rem; font-weight: 600; margin: 0 0 12px; color: var(--accent); }
  .lede { font-size: 1.08rem; margin: 0 0 28px; }

  .areas { display: grid; gap: 14px; }
  .area {
    display: block; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--accent-2);
    padding: 18px 22px; border-radius: 4px; color: var(--ink); transition: background .15s;
  }
  .area:hover { background: var(--card-hover); text-decoration: none; }
  .area h3 { margin: 0 0 6px; font-size: 1.2rem; color: var(--accent); }
  .area p { margin: 0 0 8px; }
  .more { font: 600 0.9rem "Source Sans 3", sans-serif; color: var(--link); }

  .crumb { font: 0.9rem "Source Sans 3", sans-serif; margin-bottom: 18px; }
  .yr { font: 600 0.85rem "Source Sans 3", sans-serif; color: var(--muted); margin: 26px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
  ul.pubs { list-style: none; padding: 0; margin: 0; }
  ul.pubs li { padding: 7px 0 7px 1.4em; text-indent: -1.4em; }
  .t { font-weight: 600; }
  .v { font-style: italic; }
  .filter { font: 0.95rem "Source Sans 3", sans-serif; width: 100%; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); margin: 6px 0 4px; }
  .count { font: 0.85rem "Source Sans 3", sans-serif; color: var(--muted); }

  .sidebox { background: var(--paper); border: 1px solid var(--rule); padding: 16px 20px; border-radius: 4px; font-size: 0.95rem; margin-top: 30px; }
  footer { border-top: 1px solid var(--rule); font: 0.85rem "Source Sans 3", sans-serif; color: var(--muted); padding: 18px 0 40px; }
  @media print {
    @page { margin: 0.6in 0.5in; }
    body { background: #fff; font-size: 10pt; line-height: 1.45; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { max-width: none; padding: 0; }
    header.site .wrap { padding-top: 0; padding-bottom: 8px; }
    nav, footer, .filter { display: none; }

    h2 { font-size: 14pt; margin-bottom: 6px; }
    .lede { font-size: 10.5pt; margin-bottom: 12px; }
    .areas { grid-template-columns: 1fr 1fr; gap: 10px; }
    .area { padding: 9px 12px; font-size: 8.6pt; line-height: 1.4; }
    .area h3 { font-size: 10.5pt; margin-bottom: 3px; }
    .area p { margin-bottom: 4px; }
    .more { font-size: 8.5pt; }
    .yr { margin: 14px 0 4px; }
    ul.pubs li { padding: 3px 0 3px 1.4em; }
    .pg { break-before: page; }
    .area, ul.pubs li { break-inside: avoid; }
    .yr { break-after: avoid; }
    a.t { color: var(--ink); }
  }
  @media (max-width: 560px) { body { font-size: 16px; } .name { font-size: 1.6rem; } .wrap { padding: 0 16px; } }

const AREAS = [
  { id: "transfers", name: "Intergenerational Transfers and the Generational Economy",
    text: "Every society must move resources from the working ages to children and the elderly — through families, through governments, and through asset markets. Beginning with work with Shelley Lapkoff in the 1980s, I developed a formal framework for measuring these flows and showing how they interact with population age structure. With Andrew Mason I co-founded the National Transfer Accounts project, now a network of research teams in more than sixty countries that introduces age into national income accounts. This work underlies our analyses of the first and second demographic dividends, of whether low fertility is really a problem, and of how population aging reshapes saving, wealth, and economic growth." },
  { id: "aging", name: "Population Aging, Public Finance, and Social Security",
    text: "Population aging puts pressure on pensions, health care, and public budgets. I have studied how longer life and lower fertility affect Social Security and Medicare, how alternative pension designs share demographic risk across generations, and what the full lifetime fiscal impacts of immigrants and their descendants are. I co-chaired the National Academy of Sciences committee on the long-term macroeconomic effects of an aging U.S. population, whose reports examined the macroeconomy and the growing gap in life expectancy by income." },
  { id: "forecasting", name: "Stochastic Population Forecasting",
    text: "Conventional projections bracket the future with high, medium, and low scenarios that have no probabilistic meaning. With Shripad Tuljapurkar and others I developed methods for fully stochastic forecasts of fertility, mortality, and population, and for propagating that uncertainty into forecasts of public budgets and the Social Security trust fund — quantifying our ignorance rather than hiding it. These methods have since been adopted in official Social Security and budget forecasting." },
  { id: "mortality", name: "Modeling and Forecasting Mortality",
    text: "With Lawrence Carter I introduced in 1992 what has become known as the Lee–Carter method, which models the age pattern of death rates as driven by a single time-varying index that can be forecast with standard time-series methods. The approach is now widely used by statistical offices, actuaries, and the United Nations. Later work with Nan Li and others extended it to coherent forecasts for groups of populations, to populations with limited data, and to the rotation of age patterns of mortality decline. More recent work examines life expectancy reversals and the mortality of epidemics." },
  { id: "biodemography", name: "Evolutionary Biodemography of Aging",
    text: "Why do we age, and why do humans live so long after the end of reproduction? The classical evolutionary theory of senescence focuses on births. I argued that in social species, transfers from older to younger individuals also shape the force of selection, so that post-reproductive survival can have evolutionary value. With Cyrus Chu and other collaborators I have developed formal models of the co-evolution of transfers, longevity, menopause, and the U-shaped age pattern of mortality, and with Karen Kramer I have studied children's and elders' economic roles in Maya and other subsistence societies." },
  { id: "history", name: "Historical Demography and Population Dynamics",
    text: "My earliest research used econometric and time-series methods to study pre-industrial England: how fertility, mortality, and nuptiality responded to wages, prices, and weather, and whether populations were held near equilibrium by homeostatic Malthusian feedback. I developed inverse projection as a method for reconstructing vital rates from parish registers, and contributed to Wrigley and Schofield's Population History of England. Related work examined dynastic cycles in historic China and fertility decline in nineteenth-century Prussia, and the general theory of population cycles and regulation in humans and other animals." },
  { id: "fertility", name: "Fertility, Population Cycles, and the Easterlin Hypothesis",
    text: "Fluctuations in births produce echoes in the age structure that can, in turn, affect later fertility. In the 1970s I worked out the formal dynamics of such controlled populations — the echo, the boom, and the bust — and studied how relative cohort size and the Easterlin hypothesis bear on fertility forecasts. Other work modeled how target family size, contraception, and changing reproductive goals translate into aggregate period rates, and I co-led a National Academy of Sciences synthesis of the determinants of fertility in developing countries." },
  { id: "development", name: "Population, Economic Development, and the Demographic Transition",
    text: "How does population growth affect economic development, and how does development in turn drive the demographic transition? I have worked on dynamic syntheses of Malthus and Boserup, on induced technological progress, and on the externalities to childbearing that might justify fertility policy. I co-chaired the National Academy working group on population growth and economic development and have written widely on the demographic transition as three centuries of fundamental change, including its consequences for human capital and growth." },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scholar = t => "https://scholar.google.com/scholar?q=" + encodeURIComponent('"' + t + '" Lee');
const cite = (au, y, t, v) =>
  `${esc(au)} (${y}). <a class="t" href="${scholar(t)}" target="_blank" rel="noopener">${esc(t)}</a>. <span class="v">${esc(v)}</span>.`;

function home(print) {
  const counts = {};
  PUBS.forEach(p => counts[p[0]] = (counts[p[0]] || 0) + 1);
  return `
    <h2>Research</h2>
    <p class="lede">I am an economist and demographer. My research has ranged from the population history of pre-industrial England to the macroeconomics of population aging, with a common thread: how population dynamics and the economy shape each other over the life cycle and across generations. Each area below links to a list of related publications.</p>
    <div class="areas">
      ${AREAS.map(a => `
        <a class="area" href="${print ? "#sec-" : "#/area/"}${a.id}">
          <h3>${esc(a.name)}</h3>
          <p>${esc(a.text)}</p>
          <span class="more">Publications (${counts[a.id] || 0}) →</span>
        </a>`).join("")}
    </div>`;
}

function areaPage(id) {
  const a = AREAS.find(x => x.id === id);
  if (!a) return home();
  const list = PUBS.filter(p => p[0] === id).sort((x, y) => y[1] - x[1]);
  return `
    <div class="crumb"><a href="#/">← All research areas</a></div>
    <h2>${esc(a.name)}</h2>
    <p class="lede">${esc(a.text)}</p>
    <input class="filter" id="q" type="search" placeholder="Filter by title, coauthor, or journal…" aria-label="Filter publications">
    <div class="count" id="cnt"></div>
    <div id="list"></div>
    <script type="application/json" id="data">${JSON.stringify(list).replace(/</g, "\\u003c")}<\/script>`;
}

function renderList(list, q) {
  q = (q || "").toLowerCase().trim();
  const shown = q ? list.filter(p => p.slice(1).join(" ").toLowerCase().includes(q)) : list;
  document.getElementById("cnt").textContent = `${shown.length} of ${list.length} publications`;
  let html = "", yr = null;
  shown.forEach(([, y, au, t, v]) => {
    if (y !== yr) { if (yr !== null) html += "</ul>"; html += `<div class="yr">${y}</div><ul class="pubs">`; yr = y; }
    html += `<li>${cite(au, y, t, v)}</li>`;
  });
  if (yr !== null) html += "</ul>";
  document.getElementById("list").innerHTML = html || "<p>No matches.</p>";
}

// Print view: front page, then one section per area, each starting on a new page.
function printAll() {
  return home(true) + AREAS.map(a => {
    const list = PUBS.filter(p => p[0] === a.id).sort((x, y) => y[1] - x[1]);
    let html = "", yr = null;
    list.forEach(([, y, au, t, v]) => {
      if (y !== yr) { if (yr !== null) html += "</ul>"; html += `<div class="yr">${y}</div><ul class="pubs">`; yr = y; }
      html += `<li>${cite(au, y, t, v)}</li>`;
    });
    return `
      <section class="pg" id="sec-${a.id}">
        <h2>${esc(a.name)}</h2>
        <p class="lede">${esc(a.text)}</p>
        <div class="count">${list.length} publications</div>
        ${html}</ul>
      </section>`;
  }).join("");
}

function books() {
  return `
    <h2>Books and Reports</h2>
    <ul class="pubs">${BOOKS.map(([y, au, t, v]) => `<li>${cite(au, y, t, v)}</li>`).join("")}</ul>`;
}

function about() {
  return `
    <h2>About</h2>
    <p>Ronald Lee is Professor of the Graduate School in Demography and Economics at the University of California, Berkeley, where he taught from 1979 and directed the Center for the Economics and Demography of Aging (1994–2013) and the demography training programs. He received a B.A. in philosophy from Reed College, an M.A. in demography from Berkeley, and a Ph.D. in economics from Harvard, followed by postdoctoral work at INED in Paris. Before Berkeley he taught economics at the University of Michigan. He was a Peace Corps volunteer in Ethiopia.</p>
    <p>He is a member of the National Academy of Sciences and the American Philosophical Society, a Fellow of the American Academy of Arts and Sciences, and a Corresponding Fellow of the British Academy. He served as President of the Population Association of America and has received PAA's Mindel C. Sheps and Irene B. Taeuber awards, a Guggenheim Fellowship, three NIA MERIT awards, and an honorary doctorate from Lund University. With Andrew Mason he founded the National Transfer Accounts project.</p>
    <div class="sidebox">
      <strong>Contact</strong><br>
      Department of Demography, University of California, Berkeley<br>
      <a href="https://www.ntaccounts.org" target="_blank" rel="noopener">National Transfer Accounts</a> ·
      <a href="https://scholar.google.com/scholar?q=author%3A%22Ronald+D+Lee%22+demography" target="_blank" rel="noopener">Google Scholar</a>
    </div>`;
}

function route() {
  const h = location.hash.replace(/^#/, "") || "/";
  const view = document.getElementById("view");
  let nav = "home";
  if (h.startsWith("/area/")) {
    view.innerHTML = areaPage(h.slice(6));
    const d = document.getElementById("data");
    if (d) {
      const list = JSON.parse(d.textContent);
      renderList(list, "");
      document.getElementById("q").addEventListener("input", e => renderList(list, e.target.value));
    }
  } else if (h === "/print") { view.innerHTML = printAll(); }
  else if (h === "/books") { view.innerHTML = books(); nav = "books"; }
  else if (h === "/about") { view.innerHTML = about(); nav = "about"; }
  else view.innerHTML = home();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === nav));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
